[variables]
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
NEXT_TELEMETRY_DISABLED = "1"

# Only Node from nix; pnpm comes from corepack using "packageManager" in package.json.
# Enabled in setup so it still works when the platform overrides the install command.
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
cmds = ["npm install -g corepack@0.34 && corepack enable"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

# "build" emits the Prisma contract first; "start" runs `prisma db update` first
# (destructive schema changes are refused rather than applied).
[start]
cmd = "pnpm start"
